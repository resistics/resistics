repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        description: Python linting
        entry: uv run --locked --no-sync ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        description: Python formatting
        entry: uv run --locked --no-sync ruff format
        language: system
        types_or: [python, pyi]
      - id: pydoclint
        name: pydoclint
        description: Baseline-free MyST docstring contract linting
        entry: uv run --locked --no-sync pydoclint --config=pyproject.toml
        language: system
        files: ^resistics/.*\.py$
      - id: pyrefly
        name: pyrefly
        description: Type checking
        entry: uv run --locked --no-sync pyrefly check
        language: system
        pass_filenames: false
        always_run: true
