[tool.pydoclint]
style = "sphinx"
arg-type-hints-in-docstring = false
arg-type-hints-in-signature = true
check-arg-order = true
skip-checking-short-docstrings = false
skip-checking-raises = false
skip-checking-private-functions = false
check-return-types = false
check-yield-types = false
# docstring-parser-fork does not recognise MyST attribute syntax as a class
# attribute section. Attribute prose remains mandatory and is reviewed in the
# rendered API, while Pydantic and Python own the field types.
check-class-attributes = false
check-style-mismatch = true
check-arg-defaults = false
auto-regenerate-baseline = false
show-filenames-in-every-violation-message = true
native-mode-noqa-location = "definition"
