[project]
name = "resistics"
version = "1.0.0a3"
description = "Python package for processing magnetotelluric data"
authors = [{ name = "Neeraj Shah", email = "resistics@outlook.com" }]
requires-python = ">=3.12,<3.15"
readme = "README.md"
license = "MIT"
license-files = ["LICENCE.txt"]
maintainers = [{ name = "Neeraj Shah", email = "resistics@outlook.com" }]
keywords = [
    "geophysics",
    "magnetotellurics",
    "electromagnetic",
    "resistivity",
    "statistics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=2.5.0",
    "scipy>=1.18.0",
    "pandas>=3.0.3",
    "tsdownsample>=0.1.5.1",
    "attotime>=0.2.3",
    "plotly>=6.8.0",
    "fast-sugiyama>=0.5.3",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "PyYAML>=6.0.3",
    "textual[syntax]>=8.2.8",
    "regressioninc>=0.1.0a0",
    "mth5>=0.6.8",
    "xarray>=2026.4.0",
]

[project.scripts]
resistics = "resistics.tui:main"

[project.urls]
Homepage = "https://www.resistics.io"
Repository = "https://github.com/resistics/resistics"
Documentation = "https://resistics.readthedocs.io/"
Source = "https://github.com/resistics/resistics"
"Bug Tracker" = "https://github.com/resistics/resistics/issues"

[dependency-groups]
# Matplotlib backs fenced API plots in Sphinx and plot-focused tests.
shared = ["matplotlib>=3.11.0"]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.22",
    "pydoclint>=0.9.1",
    "pyrefly==1.1.1",
    "types-PyYAML>=6.0.12.20260518",
]
docs = [
    "Sphinx>=9.1.0",
    "furo>=2025.12.19",
    "sphinxext-opengraph>=0.13.0",
    "sphinx-copybutton>=0.5.2",
    "myst-nb>=1.4.0",
]
tests = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]

[tool.uv]
default-groups = ["shared", "dev", "docs", "tests"]

[tool.uv.sources]
regressioninc = { path = "../regressioninc", editable = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/LICENCE.txt",
    "/README.md",
    "/pyproject.toml",
    "/resistics",
    "/tests",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["resistics", "tests"]
markers = [
    "performance: timing-sensitive checks that must run without coverage instrumentation",
]

[tool.pyrefly]
baseline = "pyrefly-baseline.json"
output-format = "min-text"
preset = "default"
project-includes = ["resistics"]
python-version = "3.12"

[tool.coverage.paths]
source = ["resistics"]

[tool.coverage.run]
branch = true
source = ["resistics"]

[tool.coverage.report]
fail_under = 75.95
precision = 2
show_missing = false

[tool.coverage.html]
directory = ".artifacts/hardening/coverage/html"

[tool.coverage.xml]
output = ".artifacts/hardening/coverage/coverage.xml"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["docs", "examples"]
force-exclude = true

[tool.ruff.format]
docstring-code-format = false
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
external = ["DOC"]
select = [
    "A",
    "B",
    "C4",
    "C90",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "E",
    "F",
    "I",
    "PERF",
    "PT",
    "RUF",
    "S",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "E501", # Ruff format is the line-length authority.
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.ruff.lint.pydocstyle]
ignore-decorators = ["pydantic.field_validator", "pydantic.model_validator"]

[tool.ruff.lint.per-file-ignores]
"resistics/transfunc.py" = [
    "RUF012", # Pydantic copies and validates these model-field list defaults.
]
"resistics/tui/app.py" = [
    "D102", # Textual callbacks and actions are framework entry points, not public APIs.
    "RUF012", # Textual requires mutable BINDINGS and related class attributes.
    "SIM117", # Nested Textual context managers mirror the composed widget tree.
]
"resistics/tui/screens/*.py" = [
    "D102", # Textual callbacks and actions are framework entry points, not public APIs.
    "RUF012", # Textual requires mutable BINDINGS and related class attributes.
    "SIM117", # Nested Textual context managers mirror the composed widget tree.
]
"scripts/*.py" = [
    "D100", # Maintenance scripts are documented by their CLI help and hardening plan.
    "D101",
    "D102",
    "D103",
    "D104",
    "S607", # Repository scripts invoke the cross-platform git executable.
]
"tests/**/*.py" = [
    "D100", # Tests describe behaviour through names, fixtures, and assertions.
    "D101",
    "D102",
    "D103",
    "D104",
    "PT014", # Parameter objects may compare equally while exercising distinct modes.
    "RUF012", # Test process doubles intentionally declare mutable class metadata.
    "S101", # Pytest uses plain assertions.
    "S108", # Test fixtures deliberately exercise temporary-looking paths.
]

[tool.pydoclint]
style = "sphinx"
arg-type-hints-in-docstring = false
arg-type-hints-in-signature = true
check-arg-order = true
skip-checking-short-docstrings = false
skip-checking-raises = false
skip-checking-private-functions = false
check-return-types = false
check-yield-types = false
# docstring-parser-fork does not recognise MyST attribute syntax as a class
# attribute section. Attribute prose remains mandatory and is reviewed in the
# rendered API, while Pydantic and Python own the field types.
check-class-attributes = false
check-style-mismatch = true
check-arg-defaults = false
auto-regenerate-baseline = false
show-filenames-in-every-violation-message = true
native-mode-noqa-location = "definition"
