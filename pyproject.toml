[project]
name = "resistics"
version = "1.0.0a3"
description = "Python package for processing magnetotelluric data"
authors = [{ name = "Neeraj Shah", email = "resistics@outlook.com" }]
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "MIT"
license-files = ["LICENCE.txt"]
maintainers = [{ name = "Neeraj Shah", email = "resistics@outlook.com" }]
keywords = [
    "geophysics",
    "magnetotellurics",
    "electromagnetic",
    "resistivity",
    "statistics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.20.2",
    "scipy>=1.6.2",
    "pandas>=1.2.3",
    "tsdownsample>=0.1.5.1,<0.2",
    "attotime==0.2.3",
    "plotly>=5.11.0",
    "fast-sugiyama==0.5.3",
    "loguru>=0.5.3",
    "scikit-learn>=1.1.1",
    "pydantic>=2.0",
    "prettyprinter>=0.18.0",
    "PyYAML>=5.4.1",
    "tqdm>=4.61.0",
    "textual[syntax]>=1.0.0",
    "regressioninc",
    "mth5>=0.4.1",
    "obspy>=1.4.2",
]

[project.scripts]
resistics = "resistics.tui:main"

[project.urls]
Homepage = "https://www.resistics.io"
Repository = "https://github.com/resistics/resistics"
Documentation = "https://resistics.readthedocs.io/"
Source = "https://github.com/resistics/resistics"
"Bug Tracker" = "https://github.com/resistics/resistics/issues"

[dependency-groups]
shared = ["matplotlib"]
dev = [
    "black",
    "pre-commit",
    "ruff>=0.15.22,<0.16",
    "darglint",
]
docs = [
    "Sphinx",
    "furo",
    "sphinx-gallery",
    "sphinxext-opengraph",
    "autodoc-pydantic",
    "sphinx-copybutton",
    "kaleido",
    "ipython",
    "nbformat",
    "seedir",
    "emoji",
]
tests = ["pytest", "pytest-cov", "pytest-html", "mypy"]
notebooks = ["ipykernel>=6.22.0,<7"]

[tool.uv]
default-groups = ["shared", "dev", "docs", "tests", "notebooks"]

[tool.uv.sources]
regressioninc = { path = "../regressioninc", editable = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.rst",
    "/LICENCE.txt",
    "/README.md",
    "/pyproject.toml",
    "/resistics",
    "/tests",
]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"
minversion = "6.0"
testpaths = ["resistics", "tests"]

[tool.coverage.paths]
source = ["resistics"]

[tool.coverage.run]
branch = true
source = ["resistics"]

[tool.coverage.report]
fail_under = 75.95
precision = 2
show_missing = false

[tool.coverage.html]
directory = ".artifacts/hardening/coverage/html"

[tool.coverage.xml]
output = ".artifacts/hardening/coverage/coverage.xml"

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["docs", "examples"]
force-exclude = true

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "C90",
    "E",
    "F",
    "I",
    "PERF",
    "PT",
    "RUF",
    "S",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "E501", # Black remains the line-length authority until Checkpoint 2.2.
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.ruff.lint.per-file-ignores]
"resistics/transfunc.py" = [
    "RUF012", # Pydantic copies and validates these model-field list defaults.
]
"resistics/testing.py" = [
    "S101", # Assertions validate internal synthetic-data invariants.
    "S311", # Non-cryptographic randomness generates synthetic test data.
]
"resistics/tui.py" = [
    "RUF012", # Textual requires mutable BINDINGS and related class attributes.
    "SIM117", # Nested Textual context managers mirror the composed widget tree.
]
"scripts/*.py" = [
    "S607", # Repository scripts invoke the cross-platform git executable.
]
"tests/**/*.py" = [
    "PT014", # Parameter objects may compare equally while exercising distinct modes.
    "RUF012", # Test process doubles intentionally declare mutable class metadata.
    "S101", # Pytest uses plain assertions.
    "S108", # Test fixtures deliberately exercise temporary-looking paths.
]
