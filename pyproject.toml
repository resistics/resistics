[project]
name = "resistics"
version = "1.0.0a3"
description = "Python package for processing magnetotelluric data"
authors = [{ name = "Neeraj Shah", email = "resistics@outlook.com" }]
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "MIT"
license-files = ["LICENCE.txt"]
maintainers = [{ name = "Neeraj Shah", email = "resistics@outlook.com" }]
keywords = [
    "geophysics",
    "magnetotellurics",
    "electromagnetic",
    "resistivity",
    "statistics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.20.2",
    "scipy>=1.6.2",
    "pandas>=1.2.3",
    "tsdownsample>=0.1.5.1,<0.2",
    "attotime==0.2.3",
    "plotly>=5.11.0",
    "fast-sugiyama==0.5.3",
    "loguru>=0.5.3",
    "scikit-learn>=1.1.1",
    "pydantic>=2.0",
    "prettyprinter>=0.18.0",
    "PyYAML>=5.4.1",
    "textual[syntax]>=1.0.0",
    "regressioninc",
    "mth5>=0.4.1",
    "xarray",
    "obspy>=1.4.2",
]

[project.scripts]
resistics = "resistics.tui:main"

[project.urls]
Homepage = "https://www.resistics.io"
Repository = "https://github.com/resistics/resistics"
Documentation = "https://resistics.readthedocs.io/"
Source = "https://github.com/resistics/resistics"
"Bug Tracker" = "https://github.com/resistics/resistics/issues"

[dependency-groups]
shared = ["matplotlib"]
dev = [
    "pre-commit",
    "ruff>=0.15.22,<0.16",
    "pydoclint>=0.9.1,<0.10",
    "pyrefly==1.1.1",
    "types-PyYAML",
]
docs = [
    "Sphinx",
    "furo",
    "sphinx-gallery",
    "sphinxext-opengraph",
    "autodoc-pydantic",
    "sphinx-copybutton",
    "kaleido",
    "ipython",
    "nbformat",
    "seedir",
    "emoji",
]
tests = ["pytest", "pytest-cov", "pytest-html"]
notebooks = ["ipykernel>=6.22.0,<7"]

[tool.uv]
default-groups = ["shared", "dev", "docs", "tests", "notebooks"]

[tool.uv.sources]
regressioninc = { path = "../regressioninc", editable = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.rst",
    "/LICENCE.txt",
    "/README.md",
    "/pyproject.toml",
    "/resistics",
    "/tests",
]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"
minversion = "6.0"
testpaths = ["resistics", "tests"]

[tool.pyrefly]
baseline = "pyrefly-baseline.json"
output-format = "min-text"
preset = "default"
project-includes = ["resistics"]
python-version = "3.11"

[tool.coverage.paths]
source = ["resistics"]

[tool.coverage.run]
branch = true
source = ["resistics"]

[tool.coverage.report]
fail_under = 75.95
precision = 2
show_missing = false

[tool.coverage.html]
directory = ".artifacts/hardening/coverage/html"

[tool.coverage.xml]
output = ".artifacts/hardening/coverage/coverage.xml"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["docs", "examples"]
force-exclude = true

[tool.ruff.format]
docstring-code-format = false
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
external = ["DOC"]
select = [
    "A",
    "B",
    "C4",
    "C90",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "E",
    "F",
    "I",
    "PERF",
    "PT",
    "RUF",
    "S",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "E501", # Ruff format is the line-length authority.
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.ruff.lint.pydocstyle]
ignore-decorators = ["pydantic.field_validator", "pydantic.model_validator"]

[tool.ruff.lint.per-file-ignores]
"resistics/transfunc.py" = [
    "RUF012", # Pydantic copies and validates these model-field list defaults.
]
"resistics/tui/app.py" = [
    "D102", # Textual callbacks and actions are framework entry points, not public APIs.
    "RUF012", # Textual requires mutable BINDINGS and related class attributes.
    "SIM117", # Nested Textual context managers mirror the composed widget tree.
]
"resistics/tui/screens/*.py" = [
    "D102", # Textual callbacks and actions are framework entry points, not public APIs.
    "RUF012", # Textual requires mutable BINDINGS and related class attributes.
    "SIM117", # Nested Textual context managers mirror the composed widget tree.
]
"scripts/*.py" = [
    "D100", # Maintenance scripts are documented by their CLI help and hardening plan.
    "D101",
    "D102",
    "D103",
    "D104",
    "S607", # Repository scripts invoke the cross-platform git executable.
]
"tests/**/*.py" = [
    "D100", # Tests describe behaviour through names, fixtures, and assertions.
    "D101",
    "D102",
    "D103",
    "D104",
    "PT014", # Parameter objects may compare equally while exercising distinct modes.
    "RUF012", # Test process doubles intentionally declare mutable class metadata.
    "S101", # Pytest uses plain assertions.
    "S108", # Test fixtures deliberately exercise temporary-looking paths.
]

[tool.pydoclint]
style = "numpy"
baseline = "pydoclint-baseline.txt"
arg-type-hints-in-docstring = true
arg-type-hints-in-signature = true
check-arg-order = true
skip-checking-short-docstrings = false
skip-checking-raises = false
skip-checking-private-functions = false
check-return-types = true
check-yield-types = true
check-class-attributes = true
check-style-mismatch = false
check-arg-defaults = false
auto-regenerate-baseline = false
show-filenames-in-every-violation-message = true
native-mode-noqa-location = "definition"
