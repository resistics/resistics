[project]
name = "resistics"
version = "1.0.0-alpha.3"
description = "Python package for processing magnetotelluric data"
authors = [{ name = "Neeraj Shah", email = "resistics@outlook.com" }]
requires-python = ">=3.11,<=3.14"
readme = "README.md"
license = "MIT"
maintainers = [{ name = "Neeraj Shah", email = "resistics@outlook.com" }]
keywords = [
    "geophysics",
    "magnetotellurics",
    "electromagnetic",
    "resistivity",
    "statistics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.20.2",
    "scipy>=1.6.2",
    "pandas>=1.2.3",
    "lttbc>=0.2.1",
    "attotime==0.2.3",
    "plotly>=5.11.0",
    "fast-sugiyama==0.5.3",
    "loguru>=0.5.3",
    "scikit-learn>=1.1.1",
    "pydantic>=2.0",
    "prettyprinter>=0.18.0",
    "PyYAML>=5.4.1",
    "tqdm>=4.61.0",
    "textual[syntax]>=1.0.0",
    "regressioninc",
    "mth5>=0.4.1",
    "obspy>=1.4.2",
]

[project.scripts]
resistics = "resistics.tui:main"

[project.urls]
Homepage = "https://www.resistics.io"
Repository = "https://github.com/resistics/resistics"
Documentation = "https://www.resistics.io"
Source = "https://github.com/resistics/resistics"
"Bug Tracker" = "https://github.com/resistics/resistics/issues"

[dependency-groups]
shared = ["matplotlib"]
dev = [
    "black",
    "pre-commit",
    "flake8",
    "flake8-builtins",
    "flake8-docstrings",
    "flake8-bandit",
    "flake8-pytest-style",
    "flake8-cognitive-complexity",
    "flake8-expression-complexity",
    "darglint",
]
docs = [
    "Sphinx",
    "furo",
    "sphinx-gallery",
    "sphinxext-opengraph",
    "autodoc-pydantic",
    "sphinx-copybutton",
    "kaleido",
    "ipython",
    "nbformat",
    "seedir",
    "emoji",
]
tests = ["pytest", "pytest-cov", "pytest-html", "mypy"]
notebooks = ["ipykernel>=6.22.0,<7"]

[tool.uv]
default-groups = ["shared", "dev", "docs", "tests", "notebooks"]

[tool.uv.sources]
regressioninc = { path = "../regressioninc", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--doctest-modules"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"
minversion = "6.0"
testpaths = ["resistics", "tests"]

[tool.coverage.paths]
source = ["resistics"]

[tool.coverage.run]
branch = true
source = ["resistics"]

[tool.coverage.report]
show_missing = false

[tool.coverage.html]
directory = "artifacts/coverage_html"

[tool.coverage.xml]
output = "coverage.xml"

[tool.black]
line-length = 88
target-version = ["py38"]
